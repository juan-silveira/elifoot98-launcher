name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compilador do iniciar.exe
        run: sudo apt-get install -y -qq gcc-mingw-w64-i686

      - name: Build Linux package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.0-dev"; fi
          bash scripts/build-linux.sh "$V"
          bash scripts/build-mac.sh "$V"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*-macOS.zip
          if-no-files-found: error

  build-installer:
    runs-on: windows-latest
    needs: build-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Fetch third-party binaries (otvdm, DOSBox)
        shell: bash
        run: bash scripts/fetch-deps.sh

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # v0.1.5 -> 0.1.5 (strip leading 'v' pra ficar SemVer puro no exe/manifest)
            V="${GITHUB_REF#refs/tags/v}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF#refs/tags/}"
          else
            V="0.0.0-dev.$(date +%Y%m%d%H%M%S)"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "==> version = $V"

      - name: Build launcher (Release, x86)
        shell: bash
        run: dotnet build src/ElifootLauncher.csproj -c Release -p:Version=${{ steps.version.outputs.value }} -p:AssemblyVersion=${{ steps.version.outputs.value }}.0 -p:FileVersion=${{ steps.version.outputs.value }}.0

      - name: Build ScreenHook.dll (x86 native, MinHook)
        shell: pwsh
        run: |
          cmake -A Win32 -S native/ScreenHook -B build/screenhook
          cmake --build build/screenhook --config Release
          copy build\screenhook\Release\ScreenHook.dll src\bin\Release\net48\ScreenHook.dll

      - name: Build portable launcher (.exe unico, sem .NET Framework)
        shell: bash
        run: |
          bash scripts/build-windows-portatil.sh "${{ steps.version.outputs.value }}" build/screenhook/Release/ScreenHook.dll
          mkdir -p installer/Output
          cp dist/Elifoot98-*-Windows-portatil.exe installer/Output/

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Compile launcher installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" installer\setup.iss

      - name: Zip installer (evita bloqueios de navegador em .exe)
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\Output\elifoot98-launcher-setup-*.exe | Select-Object -First 1
          $zip = "installer\Output\$([System.IO.Path]::GetFileNameWithoutExtension($exe.Name)).zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zip -Force
          Write-Host "zip: $zip"

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: installer/Output

      - name: Upload build artifact (always, for debug)
        uses: actions/upload-artifact@v4
        with:
          name: launcher-installer
          path: |
            installer/Output/*.exe
            installer/Output/*.zip
            installer/Output/*.deb
            installer/Output/*.AppImage
            installer/Output/*-macOS.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/*.exe
            installer/Output/*.zip
            installer/Output/*.deb
            installer/Output/*.AppImage
            installer/Output/*-macOS.zip
          generate_release_notes: true
          name: ${{ steps.version.outputs.value }}
          body: |
            ## Download

            - **Windows 10/11** (escolha um):
              - **`elifoot98-launcher-setup-*.zip`**: RECOMENDADO. O instalador normal dentro de um .zip (o navegador não bloqueia). Extraia e execute o `.exe` de dentro.
              - **`elifoot98-launcher-setup-*.exe`**: o mesmo instalador, sem o .zip (alguns navegadores bloqueiam o download).
              - **`Elifoot98-*-Windows-portatil.exe`**: o launcher sem instalar. Um arquivo só, que já traz o jogo: abre o launcher (o mesmo do Linux, com Jogar, editores e Configurações). Use se o launcher instalado não abrir (falta do .NET Framework 4.8). Tem o Tamanho do jogo (alta definição) do Linux.
              - Nenhum deles é assinado: se o Windows avisar "O Windows protegeu o computador", clique em **Mais informações → Executar assim mesmo**.
            - **`elifoot98_*_amd64.deb`** — Linux (Debian/Ubuntu/Mint): instale e abra "Elifoot 98" no menu.
            - **`Elifoot98-*-x86_64.AppImage`** — Linux (qualquer distro): marque como executável e rode.
            - **`Elifoot98-*-macOS.zip`** — macOS 10.15+ (Intel ou Apple Silicon com Rosetta 2): extraia e arraste o `Elifoot98.app` para Aplicativos. O app não é assinado pela Apple: na 1ª vez, clique com o botão direito → **Abrir** (ou rode `xattr -cr /Applications/Elifoot98.app`).
            - **`Elifoot98-*-Android.apk`** — Android 8+: instale o APK (permita "fontes desconhecidas"). Launcher com os mesmos menus; o jogo funciona em retrato e paisagem, com botões (teclado, Esc, Enter, táticas, T = 5-0-5, M, titular/reserva), abas das janelas abertas e zoom com pinça.
            - No Linux e no macOS o launcher tem as mesmas funções do Windows e usa o Wine do sistema (ou baixa um portátil na 1ª vez: ~95 MB no Linux, ~180 MB no macOS).
            - O otvdm usado no Linux/macOS é a build de desenvolvimento 2703 (GPL-2.0, código em https://github.com/otya128/winevdm, commit a31d1c27).

            Instala em `C:\Elifoot98Launcher`.

            ## O que tem no launcher

            - **Jogar Elifoot 98** — abre o jogo em janela (640×600 ou resolução configurada), centralizado, sem tela cheia forçada
            - **Editor de Equipes** — abre o EDITEQ.EXE original
            - **Editor de Árbitros** — edita a lista de juízes (nome + país) diretamente no `REFEREE.TXE`
            - **Editor de Save** — edita **verba** do clube + **força** e **salário** dos jogadores em qualquer `.e98`
              - Lista todos os times do save (funciona com patches da comunidade de 42 a 128+ times)
              - Aceita saves single-coach e multi-coach (até 6 técnicos)
              - Backup `.bak` automático na primeira gravação
            - **Aplicar Patch** — instala patches `.zip` da comunidade numa **biblioteca**
              - Troque entre os patches já aplicados ou volte aos times originais nas Configurações (campo **Times**), sem pastas `EQUIPAS_OLD`
              - Preserva `JOGOS/` (seus saves)
            - **Configurações** — tamanho do jogo (Linux e macOS: de 1× a 2×, com o texto nítido), tela cheia e, no Linux, janela redimensionável
              - **Versão do jogo**: original ou modificada (a modificada traz tudo o que está em "No jogo")
              - **Idioma do jogo**: o original de Portugal (padrão) ou **português do Brasil** (time, temporada, rodada, gols, Copa, escalação, bilheteria...)
              - **Registro**: jogar registrado (Registro para autor) ou não registrado (padrão)
              - **Equipes por divisão**: de 8 (original) a 20. Com mais equipes, a temporada tem mais jornadas (2 × (N − 1)), a Classificação e a tela da jornada mostram 2 divisões por página, e com 16 ou mais sobem e descem 4 equipes por divisão. Um jogo gravado só continua com o mesmo número em que foi começado: o launcher deixa na lista do jogo só os saves desse número (os outros ficam em `JOGOS/<N> equipes`)
              - Em todas as opções: até **30 jogadores** por equipe (o jogo tinha 24 nas compras e leilões, 20 no editor)

            ## No jogo

            - **Cartões amarelos** (o original só tinha o vermelho): uns 4 por jogo; o 2º no mesmo jogo vira vermelho 1 vez em 4; 3 acumulados = 1 jogo de suspensão. Aparecem na jornada, nos detalhes da partida, no plantel (**A**), na aba Jogador e no Historial. O Scout mostra os da carreira e o Editor de Save edita os acumulados.
            - Equipes por divisão de 8 a 20, até 30 jogadores por equipe, tática 5-0-5 (tecla T) e os 258 países do Turbo Elifoot.
            - **Nota e Risco de lesão** de cada jogador no leilão, na aba Jogador, no plantel dos adversários e na Lista de Jogadores (colunas Nota e RL).
            - **Lista de Jogadores** com filtros de Comportamento, Nota mínima e Risco de lesão máximo.
            - **Preço dos ingressos**: na aba Finanças, de 50% a 300% do preço de tabela nos jogos em casa; ingresso caro rende mais por torcedor, mas o público cai.
            - **Campinho na aba Escalação**, com os titulares nas cores do time.
            - **Ajuda do Árbitro**: a chance de pênalti a favor e quantos cartões o árbitro deixa de dar a cada time.

            ## Instalação

            1. Baixe o `.zip` (recomendado — evita bloqueio de navegador).
            2. Extraia o `.exe` de dentro (botão direito → Extrair).
            3. Botão direito no `.exe` → **Propriedades** → marque **Desbloquear** (opcional, mas ajuda).
            4. Execute — se aparecer **SmartScreen**: **Mais informações** → **Executar assim mesmo**.
            5. UAC vai pedir permissão pra criar pasta na raiz de C:.
            6. Siga o assistente.

            > O instalador não é assinado digitalmente (custa caro pra hobby). Verifique SHA256 se quiser.

            ## Requisitos
            - Windows 10 (1809+) ou 11
            - .NET Framework 4.8 (já vem em Win 10/11)
