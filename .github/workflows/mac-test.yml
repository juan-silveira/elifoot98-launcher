name: Teste macOS

# Monta o Elifoot98.app no Ubuntu (como a release) e roda numa maquina macOS
# (Apple Silicon + Rosetta), guardando screenshots do launcher e do jogo.
on:
  push:
    branches: [mac-teste]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: sudo apt-get install -y -qq gcc-mingw-w64-i686
      - run: bash scripts/build-mac.sh teste
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: dist/Elifoot98-teste-macOS.zip

  mac:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-app

      - name: Rosetta 2 (o Wine e o launcher sao x86_64)
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Wine portatil (o mesmo que o script baixa)
        run: |
          curl -fsSL -o wine.tar.xz https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.18/wine-devel-11.18-osx64.tar.xz
          echo "aa0ea4c82e636ae7bca2076387cb0a5affa26509ad13f119ecd0d62bd7ba6f82  wine.tar.xz" | shasum -a 256 -c -
          tar xJf wine.tar.xz
          echo "WINE_BIN=$PWD/$(ls -d Wine*.app)/Contents/Resources/wine/bin/wine" >> "$GITHUB_ENV"

      - name: Launcher
        run: |
          mkdir -p shots app && cd app && unzip -q ../Elifoot98-teste-macOS.zip
          ./Elifoot98.app/Contents/MacOS/ElifootLauncher > ../shots/launcher.log 2>&1 &
          sleep 25
          screencapture -x ../shots/1-launcher.png
          pkill -f ElifootLauncher || true

      - name: Jogo (registrado como pelo "Ativar todos os recursos")
        run: |
          S="app/Elifoot98.app/Contents/MacOS/elifoot98.sh"
          bash "$S" preparar
          D="$HOME/Library/Application Support/Elifoot98/vendor/otvdm/WINDOWS"
          # secondCode do linux/eli.cod (Registro.ContraSenha, tipo 9)
          printf '[System]\r\nsecondCode=959-240-641-242-102\r\n' > "$D/elif98.ini"
          ELIFOOT_WINE="$WINE_BIN" bash "$S" jogo > shots/jogo.log 2>&1 &
          for t in 30 60 90; do sleep 30; screencapture -x "shots/2-jogo-${t}s.png"; done
          ls -la "$D"
          unzip -l Elifoot98-teste-macOS.zip | grep iniciar.exe

      - name: eli.cod gerado pelo proprio jogo no macOS (diagnostico)
        run: |
          S="app/Elifoot98.app/Contents/MacOS/elifoot98.sh"
          D="$HOME/Library/Application Support/Elifoot98/vendor/otvdm/WINDOWS"
          "$(dirname "$WINE_BIN")/wineserver" -k || true; sleep 3
          stat -f '%N mtime=%Sm birth=%SB atime=%Sa' -t '%Y-%m-%d %H:%M:%S' "$D" "$D/SYSTEM"
          # o script recoloca o eli.cod do pacote; aqui o jogo gera o dele
          sed -i '' 's|^  cmp -s "\$APP/linux/eli.cod"|  : cmp -s "$APP/linux/eli.cod"|' "$S"
          rm -f "$D/eli.cod"
          ELIFOOT_WINE="$WINE_BIN" bash "$S" jogo > shots/jogo2.log 2>&1 &
          sleep 60; screencapture -x shots/4-eli-proprio.png
          "$(dirname "$WINE_BIN")/wineserver" -k || true
          stat -f '%N mtime=%Sm birth=%SB' -t '%Y-%m-%d %H:%M:%S' "$D" "$D/SYSTEM"
          date; echo "TZ=$TZ"; ls -la "$D"
          python3 - "$D/eli.cod" <<'PY'
          import sys
          b = open(sys.argv[1], 'rb').read(); i = 0
          while i < len(b):
              n = b[i]; r = bytearray(b[i:i+1+n])
              for _ in range(2):
                  for k in range(len(r) - 1, 0, -1): r[k] = (r[k] - r[k-1]) & 255
              print('string:', bytes(r[1:])); i += 1 + n
          PY

      - name: Guardar screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-shots
          path: shots/
